<script>
    /* Theme before first paint: saved choice, else the system setting, else the design's default. */
    (function () {
        var t = "{{ default_theme }}";
        try {
            var s = localStorage.getItem("theme");
            if (s === "light" || s === "dark") t = s;
            else if (window.matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
            else if (window.matchMedia("(prefers-color-scheme: light)").matches) t = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
    })();
</script>
